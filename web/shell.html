<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Protocol</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #080b10; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { width: min(100vw, 177.777vh); height: min(100vh, 56.25vw); outline: none; }
    #status { position: absolute; color: #dce9e9; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading Ghost Protocol…</div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () {
        document.getElementById('status').hidden = true;
        this.canvas.focus();
      },
      onAbort: function (reason) {
        document.getElementById('status').textContent = 'Unable to start: ' + reason;
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
